function parsePastedOutline(plain,html=''){
 const limit=3000;let total=0;
 const build=(label,children=[])=>{if(++total>limit)throw Error('一次最多粘贴 3000 个节点');return make(label.slice(0,10000),children)};
 if(html){
  const doc=new DOMParser().parseFromString(html,'text/html');
  doc.querySelectorAll('script,style,noscript').forEach(el=>el.remove());
  const topLists=[...doc.querySelectorAll('ul,ol')].filter(el=>!el.parentElement?.closest('ul,ol'));
  if(topLists.length){
   function readList(list,depth=0){
    if(depth>30)throw Error('层级过深，请分批粘贴');
    return [...list.children].filter(el=>el.tagName==='LI').flatMap(li=>{
     const copy=li.cloneNode(true);copy.querySelectorAll('ul,ol').forEach(el=>el.remove());
     const label=copy.textContent.trim();
     const nested=[...li.querySelectorAll('ul,ol')].filter(el=>el.parentElement.closest('li')===li);
     const children=nested.flatMap(el=>readList(el,depth+1));
     return label?[build(label,children)]:children;
    });
   }
   const nodes=topLists.flatMap(el=>readList(el));if(nodes.length)return {nodes,total};
  }
 }
 const lines=plain.replace(/\r\n?/g,'\n').split('\n').filter(line=>line.trim());
 if(lines.length>limit)throw Error('一次最多粘贴 3000 个节点');
 const nodes=[],stack=[];
 for(const line of lines){
  const prefix=line.match(/^[\t \u00a0]*/)[0];let indent=0;
  for(const ch of prefix)indent+=ch==='\t'?4:1;
  const label=line.slice(prefix.length).replace(/^[-*•]\s+/,'').trim();if(!label)continue;
  while(stack.length&&indent<=stack[stack.length-1].indent)stack.pop();
  if(stack.length>30)throw Error('层级过深，请分批粘贴');
  const n=build(label);(stack.length?stack[stack.length-1].node.children:nodes).push(n);
  stack.push({indent,node:n});
 }
 return {nodes,total};
}
function pasteOutline(plain,html=''){

  target.children.push(...result.nodes);target.collapsed=false;persist();render();focus();toast('已粘贴 '+result.total+' 个节点，保留原有缩进层级');
